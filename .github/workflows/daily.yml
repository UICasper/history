name: Daily content pipeline

on:
  schedule:
    # 06:00 local (config/config.json) is approximate here -- GitHub Actions
    # cron is always UTC. Adjust the hour below to match your timezone.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Remotion dependencies
        working-directory: remotion
        run: npm install

      - name: Run daily pipeline (main object)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          SMITHSONIAN_API_KEY: ${{ secrets.SMITHSONIAN_API_KEY }}
          RIJKSMUSEUM_API_KEY: ${{ secrets.RIJKSMUSEUM_API_KEY }}
        run: python -m pipeline.run

      # Each step below runs even if an earlier one failed (e.g. a transient
      # Gemini 503) -- one stream's failure shouldn't block the other stream
      # or stop today's site from publishing whatever did succeed.
      - name: Run daily pipeline (art explainer)
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          SMITHSONIAN_API_KEY: ${{ secrets.SMITHSONIAN_API_KEY }}
          RIJKSMUSEUM_API_KEY: ${{ secrets.RIJKSMUSEUM_API_KEY }}
        run: python -m pipeline.run_art

      - name: Upload today's package as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-package-${{ github.run_id }}
          path: output/
          retention-days: 14

      - name: Build static dashboard site (docs/)
        if: always()
        run: python -m scripts.build_static_site

      - name: Publish docs/ to the repo for GitHub Pages
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Publish dashboard for $(date -u +%Y-%m-%d)"
          git push
